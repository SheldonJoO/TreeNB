# TreeNB (TreeNewBee2 / 🌲树应用) —— xcodegen 工程定义
#
# 设计原则（见 docs/启动链改造设计.md）：
#   · openSSS 是主 executable / 主壳 —— 保留它的 AppDelegate、Shell、签名引擎、后台续签。
#   · LiveContainer 降级为内嵌 framework（LCSharedUtils / LCBootstrap / LCMachOUtils + SwiftUI 列表）。
#   · TreeWidget 并入 openSSS 已有的 AltWidgetExtension（单一 @main bundle）。
#   · 彻底删除 openSSS-as-guest 的跳转分支与 dylibify/mangled-name hack。
#
# 上游源码不 vendored 进本仓库，靠 scripts/prepare_dependencies.sh 拉到 upstream/：
#   upstream/openSSS     ← AltStore/ SideStore/ Shared/ AltWidget/ Dependencies/
#   upstream/TreeNewBee  ← LiveContainer/ LiveContainerSwiftUI/ TreeWidget/
#
# 生成工程：xcodegen generate（CI 里由 prepare_dependencies.sh 调用）

name: TreeNB
options:
  bundleIdPrefix: com.openssai
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
  sortGroups: false
  generatedIncludes: []
  fileTypes:
    xcframework:
      file: true

# ---------- 共享构建设置 ----------
settings:
  base:
    # 注意：不要在这里设 PRODUCT_NAME！会被所有 target 继承，framework 会
    # 产出 TreeNB.framework 与主 App 冲突。每个 target 自己声明。
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: AAAAA11111   # 签名时由 profile 覆盖
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREPROCESSOR_DEFINITIONS:
      - '$(inherited)'
      - 'TREENB=1'
    # App Group / URL scheme 归一，xcconfig 变量在 config/TreeNB.xcconfig 里定义
    APP_GROUP_IDENTIFIER: openssai.app
    LC_ENGINE_MODULE: LiveContainerShared
    # openSSS 原工程工程级设置：SideSign 内部的 C 头文件搜索路径
    SYSTEM_HEADER_SEARCH_PATHS:
      - '$(SRCROOT)/upstream/openSSS/Dependencies/SideSign/Dependencies'
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: '-Onone'
      GCC_OPTIMIZATION_LEVEL: '0'
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule

configFiles:
  Debug: config/TreeNB.xcconfig
  Release: config/TreeNB.xcconfig

# ---------- Swift Package 依赖（照抄 openSSS 原工程）----------
# 本地包由 prepare_dependencies.sh 随 openSSS tarball 一起落到 upstream/openSSS/Dependencies。
# 远端包版本严格对齐原 AltStore.xcodeproj 的 packageReferences，避免 API 漂移。
packages:
  SideSign:
    path: upstream/openSSS/Dependencies/SideSign
  minimuxer:
    path: upstream/openSSS/Dependencies/minimuxer
  MarkdownKit:
    url: https://github.com/bmoliveira/MarkdownKit.git
    from: 1.7.3
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    branch: master
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.9.0
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: 4.0.8
  SemanticVersion:
    url: https://github.com/SwiftPackageIndex/SemanticVersion
    # 必须 pin 0.4.0：from: 0.4.0 会解析到新版（最低 iOS16），
    # 而 TreeNB 主 App 部署目标是 iOS15，会报
    # "compiling for iOS 15.0, but module 'SemanticVersion' has a minimum deployment target of iOS 16.0"。
    exactVersion: 0.4.0
  CodeSignKit:
    url: https://github.com/mahee96/CodeSignKit
    branch: main

# ---------- Targets ----------
targets:

  # ===== 1. 主 App：openSSS 主壳 =====
  TreeNB:
    type: com.apple.product-type.application
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: TreeNB
        # dyld 启动期必须能从 App 包内解析 @rpath/* 内嵌库。缺此项时任何
        # @rpath 为 install name 的内嵌库（ZSign / OpenSSL）都会导致
        # "Library not loaded ... no such file" → 启动即 SIGABRT，界面全黑/闪退。
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
    sources:
      # --- openSSS 本体（主 executable，含 @UIApplicationMain）---
      # 注意：patch_upstream.sh 已把 Sources/Container、Sources/Routing 挂载到
      # upstream/openSSS/AltStore/TreeNB/ 下，所以这里只列上游树一次，避免重复编译。
      - path: upstream/openSSS/AltStore
        excludes:
          - '**/Info.plist'
          - '**/*.entitlements'
          # openSSS 用目录隔离 iOS/tvOS 资源；tvOS 下的 storyboard/xib 与 iOS 版
          # 同名，全收会导致 "Multiple commands produce conflicting outputs"
          - '**/tvOS/**'
      - path: upstream/openSSS/SideStore           # 签名/续签/Anisette 引擎 Swift module
        excludes:
          - '**/tvOS/**'
          # SideStore/Tests 是 XCTest / Swift Testing 测试目标，不该编进主 App；
          # 漏排会导致链接期一堆 XCTest/XCTestCase/XCUIApplication undefined symbols。
          - '**/Tests/**'
      - path: upstream/openSSS/Shared
      # --- Husk 翻译层运行资源（ANGLE 渲染用）---
      # 只 embed 不 link：翻译层运行时按路径 dlopen libANGLE-shared.dylib。
      - path: vendor/husk/frameworks/libANGLE-shared.dylib
        buildPhase: resources
      - path: vendor/husk/resources
        buildPhase: resources
      # 资源 xcassets 由 AltStore/ 递归包含（真实路径 AltStore/Core/Resources/Colors.xcassets，
      # 不存在 AltStore/Assets.xcassets —— xcodegen 对缺失 source 目录会直接报错）
    info:
      path: config/TreeNB-Info.plist
      properties:
        CFBundleShortVersionString: "1.0.261127" # TNB_VERSION_STAMP
        CFBundleVersion: "202611271039" # TNB_VERSION_STAMP
        CFBundleDisplayName: 树应用
        CFBundleIdentifier: com.openssai.app
        CFBundleURLTypes:
          - CFBundleURLName: com.openssai.app
            CFBundleURLSchemes:
              - openssai
              - sidestore          # 兼容老深链
              - livecontainer      # 兼容小组件/老用户
        LSApplicationQueriesSchemes:
          - openssai
          - livecontainer
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                # 黑屏修复 2/2：Swift 模块化后 SceneDelegate 的真实类名是
                # TreeNB.SceneDelegate（mangled: _TtC6TreeNB13SceneDelegate）。
                # 裸名 SceneDelegate 系统找不到类 → scene 加载失败 → window 无 root → 纯黑。
                # 用 $(PRODUCT_MODULE_NAME) 展开成 TreeNB，与原版写法一致。
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
                # 黑屏修复 1/2：原版 openSSS 靠 storyboard 自动建 root VC，
                # SceneDelegate.willConnectTo 不手动创建 window/root。
                # 缺这两个键 → 系统建了 window 却不知道加载哪个 storyboard → 全黑屏。
                UISceneStoryboardFile: Main
                UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - fetch
          - processing
          - audio
          - bluetooth-central
          - external-accessory
          - location
          - nearby-interaction
          - remote-notification
          - voip
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # 文档类型（IPA 导入必需）：原版 openSSS Info.plist 声明了
        # com.apple.itunes.ipa，但 xcodegen 的 info.properties 覆盖后只剩 All Files，
        # UIDocumentPicker 按 IPA UTI 过滤时找不到声明 → 选不了 .ipa 文件。
        # 这里把 IPA + pairing 导入类型补回，并保留 All Files 兜底。
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            CFBundleTypeIconFiles: []
            LSItemContentTypes:
              - com.apple.itunes.ipa
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
          - CFBundleTypeName: Mobile Device Pairing
            CFBundleTypeIconFiles: []
            LSItemContentTypes:
              - org.openssai.mobiledevicepairing
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
          # Husk 翻译层：安卓 APK 导入
          - CFBundleTypeName: Android App
            CFBundleTypeIconFiles: []
            LSItemContentTypes:
              - org.android.package-archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
          - CFBundleTypeName: All Files
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.item
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: iOS App
            UTTypeIconFiles: []
            UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeTagSpecification:
              public.mime-type: application/x-ios-app
              public.filename-extension: ipa
          - UTTypeConformsTo:
              - com.apple.plist
            UTTypeDescription: Mobile Device Pairing
            UTTypeIconFiles: []
            UTTypeIdentifier: org.openssai.mobiledevicepairing
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
                - mobiledevicepair
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Android App
            UTTypeIconFiles: []
            UTTypeIdentifier: org.android.package-archive
            UTTypeTagSpecification:
              public.mime-type: application/vnd.android.package-archive
              public.filename-extension: apk
        LSSupportsOpeningDocumentsInPlace: true
        NFCReaderUsageDescription: The guest app is requesting for this permission.
        NSAlarmKitUsageDescription: The guest app is requesting for this permission.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSAppleMusicUsageDescription: The guest app is requesting for this permission.
        NSBluetoothAlwaysUsageDescription: The guest app is requesting for this permission.
        NSBluetoothPeripheralUsageDescription: The guest app is requesting for this permission.
        NSBonjourServices:
          - _FC9F5ED42C8A._tcp
          - _airplay._tcp
          - _raop._tcp
          - "_companion-link._tcp"
          - _homekit._tcp
          - _airdrop._tcp
          - "_apple-mobdev2._tcp"
          - _remotepairing._tcp
          - _googlecast._tcp
          - "_spotify-connect._tcp"
          - _sonos._tcp
          - "_roku-rcp._tcp"
          - _daap._tcp
          - _dpap._tcp
          - _printer._tcp
          - _ipp._tcp
          - _ipps._tcp
          - "_pdl-datastream._tcp"
          - _scanner._tcp
          - _uscan._tcp
          - _http._tcp
          - _https._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _nfs._tcp
          - _ftp._tcp
          - "_sftp-ssh._tcp"
          - _webdav._tcp
          - _webdavs._tcp
          - _ssh._tcp
          - _rfb._tcp
          - _rdp._tcp
          - "_net-assistant._udp"
          - _hap._tcp
          - _matter._tcp
          - _hue._tcp
          - _mqtt._tcp
          - _coap._udp
          - _wemo._tcp
          - _presence._tcp
          - _sip._tcp
          - _h323._tcp
          - "_device-info._tcp"
          - "_sleep-proxy._udp"
          - "_dns-sd._udp"
          - "_remotepairing-pairable-host._tcp"
          - _stikpairprobe._tcp
          - _flux._udp
          - _dicom._tcp
        NSCalendarsFullAccessUsageDescription: The guest app is requesting for this permission.
        NSCalendarsWriteOnlyAccessUsageDescription: The guest app is requesting for this permission.
        NSCameraUsageDescription: The guest app is requesting for this permission.
        NSContactsUsageDescription: The guest app is requesting for this permission.
        NSFaceIDUsageDescription: The guest app is requesting for this permission.
        NSFallDetectionUsageDescription: The guest app is requesting for this permission.
        NSGKFriendListUsageDescription: The guest app is requesting for this permission.
        NSHealthClinicalHealthRecordsShareUsageDescription: The guest app is requesting for this permission.
        NSHealthShareUsageDescription: The guest app is requesting for this permission.
        NSHealthUpdateUsageDescription: The guest app is requesting for this permission.
        NSHomeKitUsageDescription: The guest app is requesting for this permission.
        NSIdentityUsageDescription: The guest app is requesting for this permission.
        NSLocalNetworkUsageDescription: The guest app is requesting for this permission.
        NSLocationAlwaysAndWhenInUseUsageDescription: The guest app is requesting for this permission.
        NSLocationDefaultAccuracyReduced: true
        NSLocationTemporaryUsageDescriptionDictionary: The guest app is requesting for this permission.
        NSLocationUsageDescription: The guest app is requesting for this permission.
        NSLocationWhenInUseUsageDescription: The guest app is requesting for this permission.
        NSMicrophoneUsageDescription: The guest app is requesting for this permission.
        NSMotionUsageDescription: The guest app is requesting for this permission.
        NSNearbyInteractionAllowOnceUsageDescription: The guest app is requesting for this permission.
        NSNearbyInteractionUsageDescription: The guest app is requesting for this permission.
        NSPhotoLibraryAddUsageDescription: The guest app is requesting for this permission.
        NSPhotoLibraryUsageDescription: The guest app is requesting for this permission.
        NSRemindersFullAccessUsageDescription: The guest app is requesting for this permission.
        NSSensorKitUsageDescription: The guest app is requesting for this permission.
        NSSiriUsageDescription: The guest app is requesting for this permission.
        NSSpeechRecognitionUsageDescription: The guest app is requesting for this permission.
        NSUserTrackingUsageDescription: The guest app is requesting for this permission.
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: true
    entitlements:
      path: config/TreeNB.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_GROUP_IDENTIFIER)
          - group.com.SideStore.SideStore
          - group.com.kdt.livecontainer
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.openssai.app
          - $(AppIdentifierPrefix)com.openssai.app.shared
        application-identifier: $(AppIdentifierPrefix)com.openssai.app
        get-task-allow: false
    dependencies:
      # Husk 翻译层（Android APK 运行引擎），独立 framework 做符号隔离。
      - target: HuskyEngine
        embed: true
      # LC 引擎（多开核心）内嵌为 framework
      # 只用 `target:` 依赖，一次搞定 build order + link + embed。
      # 不要再叠加 `framework: ... embed: true`，否则会生成两个 Embed Frameworks
      # 阶段，触发 "Multiple commands produce .../LiveContainer*.framework"。
      - target: LiveContainerShared
        embed: true
      - target: LiveContainerSwiftUI
        embed: true
      # JITLess 签名核心：LCUtils 运行时 dlopen @executable_path/Frameworks/ZSign.dylib
      # 拿到 ZSigner 类对 guest 重签。缺此 dylib 则"无 JIT 启动"必失败。
      # link: false 是关键 —— ZSign 只作为资源被 embed，绝不参与主可执行文件的
      # 静态链接。xcodegen 默认 link: true 会把编译机的 DYLIB_INSTALL_NAME_BASE
      # (/usr/local/lib) 写进主程序 LC_LOAD_DYLIB，真机 dyld 找不到该路径 →
      # 启动瞬间 SIGABRT（2026-11-24 事故）。运行期靠 dlopen 绝对路径加载。
      - target: ZSign
        embed: true
        link: false
      # ★ guest 启动必加载的注入 dylib（崩溃实证缺它 → guest 起不来）。
      #   同样只 embed 不 link，避免把编译机绝对路径写进主程序 LC_LOAD_DYLIB。
      - target: TweakLoader
        embed: true
        link: false
      - target: TestJITLess
        embed: true
        link: false
      # CydiaSubstrate 是上游预编译 framework（源码仓库 Resources/Frameworks/），
      # TweakLoader 注入 guest 后会 dlopen 它。只 embed 不 link。
      - framework: upstream/TreeNewBee/Resources/Frameworks/CydiaSubstrate.framework
        embed: true
        link: false
      # TreeWidget 已并入 AltWidgetExtension，必须显式声明 embed，
      # xcodegen 才会生成 Embed App Extensions 阶段把 .appex 放进 PlugIns/。
      # 只把它写进 scheme 的 Build/Archive entries 只会"编译"扩展，不会嵌入 IPA。
      - target: AltWidgetExtension
        embed: true
      # openSSS 原有的 SPM 依赖（主壳签名/续签/应用源全靠这些）
      - package: SideSign
        product: SideSign
      - package: minimuxer
        product: Minimuxer
      - package: MarkdownKit
        product: MarkdownKit
      - package: KeychainAccess
        product: KeychainAccess
      - package: Nuke
        product: Nuke
      - package: Starscream
        product: Starscream
      - package: SemanticVersion
        product: SemanticVersion
      # OpenSSL.xcframework 单独在 Dependencies/ 下，见 prepare_dependencies.sh
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: Network.framework
      # WidgetSettings.swift 调 WidgetCenter.reloadAllTimelines 刷新小组件
      - sdk: WidgetKit.framework

  # ===== 1b. Husk 翻译层 framework（Android APK 运行引擎）=====
  # 5.17 万行纯 C，脱离 QEMU 独立运行；不与 LiveContainerShared 的 dyld/symbol
  # 操作共享编译单元，故独立成 framework 做符号隔离。
  # GPL-2.0-or-later：整合后整个分发版需遵守 GPL 开源义务。
  HuskyEngine:
    type: com.apple.product-type.framework
    platform: iOS
    sources:
      # 翻译层主体（纯 C + 4 个 .m）。排除头文件，走 publicHeaders/modulemap。
      - path: vendor/husk/src/translation-layer-next
        excludes:
          - '**/*.h'
          - '**/*.inc'
      # 旧 translation-layer：提供 husk_tl_scan / read_entry / free（引擎检测用）。
      # Husk 官方工程同样把它整目录编进 app；不依赖 QEMU。与新目录无符号冲突。
      - path: vendor/husk/src/translation-layer
        excludes:
          - '**/*.h'
          - '**/*.inc'
      # ObjC wrapper（HuskyEngine.h/.m + modulemap）
      - path: vendor/husk/bridge
        excludes:
          - 'module.modulemap'
      - path: vendor/husk/bridge
        headerVisibility: public
        buildPhase: headers
        excludes:
          - '*.m'
          - 'module.modulemap'
    settings:
      base:
        PRODUCT_NAME: HuskyEngine
        PRODUCT_BUNDLE_IDENTIFIER: com.openssai.app.HuskyEngine
        INFOPLIST_FILE: config/HuskyEngine-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_VERSION: '5.10'
        MODULEMAP_FILE: vendor/husk/bridge/module.modulemap
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/husk/bridge
          - $(SRCROOT)/vendor/husk/src/translation-layer-next
          # husk-tl-dvm-audio.c include 了 ../translation-layer/stb_vorbis.inc
          - $(SRCROOT)/vendor/husk/src/translation-layer
        # 翻译层大量 C 文件用 GNU C 扩展；关闭一些会误报的严格检查。
        GCC_PREPROCESSOR_DEFINITIONS:
          - '$(inherited)'
          - 'TL_APPLE=1'
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_WARN_ABOUT_RETURN_TYPE: NO
        GCC_WARN_UNUSED_VARIABLE: NO
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: WebKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Accelerate.framework
      - sdk: Security.framework
      # husk-tl-dvm-sensors.m 用 CMMotionManager（Android 传感器 shim）
      - sdk: CoreMotion.framework
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - sdk: libsqlite3.tbd

  # ===== 2. LC 引擎 framework（从 TreeNewBee 源码编译）=====
  LiveContainerShared:
    type: com.apple.product-type.framework
    platform: iOS
    sources:
      - path: upstream/TreeNewBee/LiveContainer
        excludes:
          - 'main.c'                 # 入口剥离：不再由 dyld 首先命中
          - '**/*.h'                 # 头文件走 publicHeaders
          # 上游这里带的是整个 App 的 Info.plist（CFBundleExecutable=TreeApps、
          # CFBundlePackageType=APPL），它会被 xcodegen 当资源拷进 framework 当 plist。
          # installd 校验 framework 时按 plist 里的 TreeApps 找可执行文件，找不到即拒装。
          # 排除之，改用 config 下的标准 FMWK plist（见 INFOPLIST_FILE）。
          - '**/Info.plist'
      # litehook 是 TreeNewBee 的 git submodule，prepare_dependencies.sh 单独拉取。
      # dyld_bypass_validation.m 用到 litehook_hook_function，必须把实现编进来。
      - path: upstream/TreeNewBee/litehook/src
        excludes:
          - '**/*.h'
      # patch_upstream.sh 把 LCEngineEntry.m + include/ 挂到 TreeNBBridge/ 下。
      # 上面的 `**/*.h` 排除了整棵树的头文件，必须单独把桥接 include/ 声明为
      # public header，否则 modulemap 里的 umbrella header 不会进入 framework/Headers，
      # Swift 侧 import LiveContainerShared 会报 "umbrella header not found"。
      - path: upstream/TreeNewBee/LiveContainer/TreeNBBridge/include
        headerVisibility: public
        buildPhase: headers
    settings:
      base:
        PRODUCT_NAME: LiveContainerShared
        PRODUCT_BUNDLE_IDENTIFIER: com.openssai.app.LiveContainerShared
        INFOPLIST_FILE: config/LiveContainerShared-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_VERSION: '5.10'
        MODULEMAP_FILE: upstream/TreeNewBee/LiveContainer/TreeNBBridge/include/module.modulemap
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer/TreeNBBridge/include
          # LCEngineEntry.m 的 IPA 解压用 libarchive；头文件来自上游 vendor 目录。
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI/Utilities
          # 原工程靠 Xcode16 FileSystemSynchronized 把整棵源码树的 .h 纳入搜索；
          # xcodegen 没有该机制，需手动列出所有含头文件的子目录：
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer/Tweaks
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer/LivePlugInSupport
          # litehook.h 在 submodule 的 src/ 下；litehook.c 还 include 了
          # external/include/dyld_cache_format.h
          - $(SRCROOT)/upstream/TreeNewBee/litehook/src
          - $(SRCROOT)/upstream/TreeNewBee/litehook/external/include
        GCC_PREPROCESSOR_DEFINITIONS:
          - '$(inherited)'
          - 'LIVE_CONTAINER_FRAMEWORK=1'   # 让 LC 代码走 framework 分支，不抢 UIApplicationMain
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      # LCEngineEntry.m 解压 IPA 需要 archive_read_* / archive_write_disk_*
      - sdk: libarchive.tbd

  # ===== 3. LC SwiftUI 列表 framework（容器 Tab 的 UI）=====
  LiveContainerSwiftUI:
    type: com.apple.product-type.framework
    platform: iOS
    sources:
      - path: upstream/TreeNewBee/LiveContainerSwiftUI
        excludes:
          - '**/TreeOpenSSSTabView.swift'   # ★ 删除 openSSS 跳转过场页
          - '**/Info.plist'
    settings:
      base:
        PRODUCT_NAME: LiveContainerSwiftUI
        PRODUCT_BUNDLE_IDENTIFIER: com.openssai.app.LiveContainerSwiftUI
        # installd 逐个 framework 校验 Info.plist。sources 里排除了 **/Info.plist，
        # 必须显式指定一份，否则真机安装报 "Info.plist missing at
        # .../LiveContainerSwiftUI.framework/Info.plist"（本机归档不校验，CI 全绿也会漏）。
        INFOPLIST_FILE: config/LiveContainerSwiftUI-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_VERSION: '5.10'
        # 原工程 SwiftUI target 靠 bridging header 让 Swift 看到 ObjC 类
        # （LCUtils/LCAppInfo/AppSceneViewController/PiPManager/LCSharedUtils 等）。
        # 漏配会导致大量 cannot find 'LCUtils' in scope。
        SWIFT_OBJC_BRIDGING_HEADER: '$(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h'
        # Swift→ObjC 生成头文件默认落在 $(TARGET_TEMP_DIR)/Objects-normal/<arch>/，
        # xcodegen 不会像 Xcode 原生工程那样自动把它加进 LCUtils.m 的搜索路径。
        # 漏配会报 'LiveContainerSwiftUI-Swift.h' file not found。
        SWIFT_OBJC_INTERFACE_HEADER_NAME: LiveContainerSwiftUI-Swift.h
        # bridging header 与 .m 用相对路径 include 头文件；原工程靠 FileSystemSynchronized
        # 把整棵树纳入搜索路径，xcodegen 需显式列出 SwiftUI 各子目录 + LiveContainer 根。
        HEADER_SEARCH_PATHS:
          - $(TARGET_TEMP_DIR)/Objects-normal/arm64
          - $(TARGET_TEMP_DIR)/Objects-normal/armv7
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI/Models
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI/MultitaskSupport
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainerSwiftUI/Utilities
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer/Tweaks
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer/LivePlugInSupport
        GCC_PREPROCESSOR_DEFINITIONS:
          - '$(inherited)'
          - 'TREENB=1'
    dependencies:
      # 已 rebuilt 的 framework 只 link，不 embed（Embedding 由主 App 统一负责）
      - target: LiveContainerShared
        embed: false
      - sdk: SwiftUI.framework
      # LCUtils.m 的 isTXMScriptRequired 用 IOKit；unarchive.o 用 libarchive。
      # 上游 pbxproj 把这两个库挂在 LiveContainerSwiftUI target 上，xcodegen 需显式列出，
      # 否则 framework 链接阶段报一堆 Undefined symbols（IOObjectRelease/archive_*）。
      - sdk: IOKit.framework
      - sdk: libarchive.tbd

  # ===== 3b. JITLess 签名核心 ZSign.dylib =====
  # 上游 LCUtils.loadStoreFrameworksWithError2 运行时
  #   dlopen("@executable_path/Frameworks/ZSign.dylib") → NSClassFromString(@"ZSigner")
  # 对 guest 做 ZSign 重签。这是无 JIT 启动的前提（有证书密码时 invokeAppMain 跳过 JIT 检测，
  # 但 guest 仍需有效签名才能被 dlopen 执行）。
  # 源码是 ObjC++（.mm）+ C++（.cpp），链接 krzyzanowskim/OpenSSL.xcframework。
  ZSign:
    type: com.apple.product-type.library.dynamic
    platform: iOS
    sources:
      - path: upstream/TreeNewBee/ZSign
        excludes:
          - '**/*.h'          # 头文件走 HEADER_SEARCH_PATHS，不参与编译
          - '**/*.hpp'
    settings:
      base:
        PRODUCT_NAME: ZSign
        PRODUCT_BUNDLE_IDENTIFIER: com.openssai.app.ZSign
        # 产物必须是 ZSign.dylib（不是 libZSign.dylib），否则 dlopen 路径对不上。
        EXECUTABLE_PREFIX: ''
        MACH_O_TYPE: mh_dylib
        # 默认 DYLIB_INSTALL_NAME_BASE=/usr/local/lib 会把编译机绝对路径写进
        # LC_ID_DYLIB；一旦被谁链接就直接带着这个绝对路径去 dyld。改成 @rpath
        # 让 dylib 自身也用包内相对路径，配合主 App 的 @executable_path/Frameworks。
        DYLIB_INSTALL_NAME_BASE: '@rpath'
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_C_LANGUAGE_STANDARD: gnu17
        # ZSign 的 .cpp/.mm 用 #include "common/xxx.h" 等相对路径，根在 ZSign/。
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/upstream/TreeNewBee/ZSign
          - $(SRCROOT)/upstream/TreeNewBee/ZSign/common
          # <openssl/*.h> 用本地下载的 xcframework slice 的 Headers（仅头文件，不参与 embed）。
          - $(SRCROOT)/Dependencies/OpenSSL.xcframework/ios-arm64/OpenSSL.framework/Headers
        # 关键：不能用 `dependencies: - framework: OpenSSL.xcframework`。
        # 主 App 已由 SPM(remotepairingkit) 引了同名 OpenSSL.xcframework；再用 framework
        # 依赖引 Dependencies 那份会让两个来源都输出 OpenSSL.framework → "Unexpected duplicate tasks"。
        # 这里改用 OTHER_LDFLAGS 直接链本地 slice 的二进制（不产生 ProcessXCFramework 任务）。
        # 运行期 ZSign 的 @rpath/OpenSSL.framework/OpenSSL 命中主 App 已 embed 的那份（bundle id 相同）。
        OTHER_LDFLAGS:
          - $(inherited)
          - -F$(SRCROOT)/Dependencies/OpenSSL.xcframework/ios-arm64
          - -framework OpenSSL
        SKIP_INSTALL: YES

  # ===== 3b. TweakLoader —— guest 启动必加载的注入 dylib =====
  # 崩溃日志实证：guest dlopen "@loader_path/../../..Tweaks/TweakLoader.dylib"
  # 失败 → guest 起不来、闪回宿主 UI。上游 invokeAppMain 会在
  # Documents/Tweaks/ 下建到本 dylib 的符号链接，缺它必然失败。
  # 只 embed 不 link（运行期由 guest 动态加载）。
  TweakLoader:
    type: com.apple.product-type.library.dynamic
    platform: iOS
    sources:
      - path: upstream/TreeNewBee/TweakLoader
    settings:
      base:
        PRODUCT_NAME: TweakLoader
        EXECUTABLE_PREFIX: ''          # 产物名 TweakLoader.dylib，不是 libTweakLoader
        MACH_O_TYPE: mh_dylib
        DYLIB_INSTALL_NAME_BASE: '@rpath'
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos
        # TweakLoader .m 用相对路径 ../LiveContainer/utils.h 等，并 import
        # LCSharedUtils.h / UIKitPrivate.h / Localization.h（都在 LiveContainer/）。
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/upstream/TreeNewBee/LiveContainer
        # 上游这几个私有类在 guest 进程里运行期解析，链接期允许未定义。
        OTHER_LDFLAGS:
          - $(inherited)
          - -Wl,-U,_OBJC_CLASS_$_FBSSceneParameters
          - -Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace
          - -Wl,-U,_OBJC_CLASS_$_DOCConfiguration
        SKIP_INSTALL: YES

  # ===== 3c. TestJITLess —— 上游自带的 JIT-less 自检 dylib =====
  TestJITLess:
    type: com.apple.product-type.library.dynamic
    platform: iOS
    sources:
      - path: upstream/TreeNewBee/TestJITLess
    settings:
      base:
        PRODUCT_NAME: TestJITLess
        EXECUTABLE_PREFIX: ''
        MACH_O_TYPE: mh_dylib
        DYLIB_INSTALL_NAME_BASE: '@rpath'
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos
        SKIP_INSTALL: YES

  # ===== 4. Widget extension（openSSS AltWidget + TreeWidget 并入）=====
  AltWidgetExtension:
    type: com.apple.product-type.app-extension
    platform: iOS
    sources:
      # patch_upstream.sh 把 TreeLaunchWidget.swift / TreeWidgetBridge.swift
      # 挂到 AltWidget/TreeNB/ 下，递归 source 已含，无需再列 Sources/Widget
      - path: upstream/openSSS/AltWidget             # 已有单一 @main AltWidgetBundle
        excludes:
          - 'Info.plist'
          - '**/*.entitlements'
      # 原工程 AltWidgetExtension 的 fileSystemSynchronizedGroups = Shared + AltWidget，
      # 还编入 SideStore 的 WidgetData/pagination 子集（见 pbxproj exception set
      # A8EECF4A）。xcodegen 没有 FileSystemSynchronized，必须显式列出。
      - path: upstream/openSSS/Shared
        excludes:
          - 'Extensions/ALTApplication+AltStoreApp.swift'   # 依赖主 App，Widget 排外
      - path: upstream/openSSS/SideStore/Widget/WidgetData
      - path: upstream/openSSS/SideStore/Utils/pagination
      # WIDGET_EXTENSION 宏下，View+AltWidget 用到 RefreshAllAppsWidgetIntent，
      # WidgetLogManager 用到 FileManager.documentsDirectory（原定义在这两个文件）。
      # 原工程靠 AltStore group 同步进来，xcodegen 必须显式列出；这两个文件内部
      # 都有 #if WIDGET_EXTENSION/#if !WIDGET_EXTENSION 保护，不会引入主 App 依赖。
      - path: upstream/openSSS/AltStore/Intents/App Intents/RefreshAllAppsWidgetIntent.swift
      - path: upstream/openSSS/AltStore/Extensions/FileManager+URLs.swift
    info:
      path: config/AltWidget-Info.plist
      properties:
        CFBundleDisplayName: 树应用小组件
        CFBundleIdentifier: com.openssai.app.AltWidgetExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: config/AltWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.openssai.app
          - $(AppIdentifierPrefix)com.openssai.app.shared
    settings:
      base:
        PRODUCT_NAME: AltWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.openssai.app.AltWidgetExtension
        # TNBLaunchGuestIntent 用 OpenURLIntent 唤醒主 App —— 该 API 在 app extension
        # 里要求 iOS 18+（App 进程里虽是 iOS 16+）。目标设备 iOS 27，提到 18 即可。
        # 主 App 部署目标仍是 iOS 15，不受影响；AppIntent 的 iOS17 分支照常可用。
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'
        SWIFT_VERSION: '5.10'
        # 原工程 Widget 定义了 WIDGET_EXTENSION，源码里大量 #if WIDGET_EXTENSION
        # 分支靠它切换（如 UIColor+AltStore 避开 ThemeManager、Intent 避开主 App 逻辑）。
        # 漏掉会导致 cannot find 'ThemeManager' in scope 等连锁编译错误。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - '$(inherited)'
          - WIDGET_EXTENSION
        GCC_PREPROCESSOR_DEFINITIONS:
          - '$(inherited)'
          - WIDGET_EXTENSION=1
    dependencies:
      # openSSS 的 AltWidgetExtension 原本就链接 CodeSignKit（见 AltStore.xcodeproj）
      - package: CodeSignKit
        product: CodeSignKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # TNBLaunchGuestIntent 用 AppIntent/OpenURLIntent 实现 widget 点击直达 guest
      - sdk: AppIntents.framework

# ---------- Schemes ----------
schemes:
  TreeNB-App:
    build:
      targets:
        # 必须用合法 BuildType（all/testing/indexing/none），
        # 写 [debug, release] 会被 compactMap 过滤成空 → buildFor*=NO → 无 ArchiveAction
        LiveContainerShared: all
        LiveContainerSwiftUI: all
        ZSign: all
        TreeNB: all
        AltWidgetExtension: all
    run:
      target: TreeNB
    archive:
      config: Release
